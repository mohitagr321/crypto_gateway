services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: node dist/index.js
    env_file:
      - .env
      - .env.docker   # overrides DATABASE_URL/REDIS_URL to service hostnames
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["4000:4000"]
    restart: unless-stopped

  worker:
    build: ./backend
    command: node dist/workers/index.js
    env_file:
      - .env
      - .env.docker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  listener:
    build: ./backend
    command: node dist/blockchain/listener.js
    env_file:
      - .env
      - .env.docker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # TRC20 (Tron) listener. Idles as a harmless no-op while TRON_ENABLED=false, so
  # it is safe to keep declared; it begins polling once Tron is configured + on.
  listener-tron:
    build: ./backend
    command: node dist/blockchain/tronListener.js
    env_file:
      - .env
      - .env.docker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # ERC20 (Ethereum) and BTC listeners.
  #
  # These two were missing, and their absence was a silent way to lose customer
  # money rather than a missing feature: ETH_ENABLED / BTC_ENABLED are a pure
  # .env edit, after which isNetworkEnabled() lets createPayment derive and
  # persist a REAL deposit address on that chain and hand it to a customer — on
  # a chain no process in this file was watching. The deposit would never be
  # recorded, never confirmed, never swept; the funds would simply sit at an HD
  # address nobody was looking at, recoverable only by hand from the mnemonic.
  #
  # Both entrypoints already existed in the build and both idle exactly like
  # listener-tron while their chain is off (ethListener.ts logs one line and
  # sleeps unless ETH_ENABLED and ETH_HTTP_RPC are both set; bitcoinListener.ts
  # does the same on BTC_ENABLED), so declaring them costs nothing when the
  # chains are off and is the whole difference between seeing a deposit and not
  # when they are on.
  #
  # ONE instance each, like the other two: each listener is the sole writer of
  # its own chain_cursor row and the only thing that promotes payments and
  # enqueues sweeps on its chain. Do not scale these with `--scale`.
  listener-eth:
    build: ./backend
    command: node dist/blockchain/ethListener.js
    env_file:
      - .env
      - .env.docker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  listener-btc:
    build: ./backend
    command: node dist/blockchain/bitcoinListener.js
    env_file:
      - .env
      - .env.docker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  admin-panel:
    build: ./admin-panel
    ports: ["5173:80"]
    depends_on: [api]

  client-panel:
    build: ./client-panel
    ports: ["5174:80"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
