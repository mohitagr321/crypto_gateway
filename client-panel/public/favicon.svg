<!--
  PayCrypo mark.

  A "P" whose bowl is a hexagon: the letter carries the name, the hexagon is the
  blockchain-node shape every crypto product is read against. Deliberately not a
  coin glyph — this gateway settles seven assets across four chains, and a ₮ or a
  $ on a Bitcoin checkout is simply wrong (which is what the previous favicon
  did).

  Gradient is brand-500 -> accent-600 from the panels' tailwind config, so the
  tab icon, the in-app BrandMark and the transactional email header are one
  colour story. Geometry is shared with components/PayCrypoMark.tsx — change
  both together.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PayCrypo">
  <defs>
    <linearGradient id="pc" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#pc)"/>
  <g fill="#fff">
    <rect x="8.5" y="6" width="4" height="20" rx="2"/>
    <path fill-rule="evenodd" d="M18.5 6L24.56 9.5L24.56 16.5L18.5 20L12.44 16.5L12.44 9.5Z M18.5 9.8L15.73 11.4L15.73 14.6L18.5 16.2L21.27 14.6L21.27 11.4Z"/>
  </g>
</svg>
