<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything other than 0px. Without it every safe-area rule in the CSS is
         dead code and the mobile dock sits under the iPhone home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The browser chrome should continue the page, not announce the brand.
         These are the two page grounds (--n-50 / --n-950) as sRGB. -->
    <meta name="theme-color" content="#F7F7FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13121D" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Accept stablecoins, native coins and Bitcoin across four chains. Non-custodial deposit addresses, signed webhooks, and settlement to a wallet you control." />
    <title>PayCrypo — Crypto Payments for Merchants</title>
    <script>
      // Apply persisted theme before first paint to avoid flash.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var m = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (t === 'dark' || (!t && m)) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
