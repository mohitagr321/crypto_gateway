<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Accept stablecoins, native coins and Bitcoin across four chains. Non-custodial deposit addresses, signed webhooks, and settlement to a wallet you control." />
    <title>SecuriPay — Crypto Payments for Merchants</title>
    <script>
      // Apply persisted theme before first paint to avoid flash.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var m = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (t === 'dark' || (!t && m)) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
